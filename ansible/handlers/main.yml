---
# NB : pas de handler `restart ssh` ici — le restart sshd est explicite dans
# tasks/ssh.yml (avec smoke-test) pour éviter tout risque de lockout différé.

- name: Restart endlessh
  ansible.builtin.service:
    name: endlessh
    state: restarted

- name: Reload iptables
  ansible.builtin.shell: |
    iptables-restore < /etc/iptables/rules.v4
    ip6tables-restore < /etc/iptables/rules.v6
  changed_when: true
