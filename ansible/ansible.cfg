[defaults]
# Multi-env : passe -i inventories/<env>.yml à chaque ansible-playbook.
inventory = ./inventories
host_key_checking = False
retry_files_enabled = False
# YAML output : depuis ansible-core 2.13 + community.general 12, le callback
# `community.general.yaml` est supprimé. On utilise le `default` callback avec
# `result_format = yaml` à la place.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 10
deprecation_warnings = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
