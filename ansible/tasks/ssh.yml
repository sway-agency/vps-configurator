---
# === Stratégie anti-lockout ===
# 1. Écrire le drop-in sshd avec `validate: sshd -t`  → bloque si syntaxe KO
# 2. Restart sshd explicitement (pas via handler)    → SSH écoute sur ssh_port
# 3. wait_for + smoke-test SSH deploy@ssh_port depuis localhost
# 4. Si KO → playbook fail AVANT iptables (donc port 22 root@22 toujours OK)
# 5. Si OK → set_fact pour basculer la connexion sur deploy@ssh_port,
#    et meta: reset_connection pour forcer la réouverture.
# La session SSH bootstrap (root@22) reste vivante (KillMode=process + conntrack)
# tant que iptables n'a pas appliqué la policy DROP — d'où le timing.

- name: Deploy hardened sshd config (drop-in)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — vps-configurator
      Port {{ ssh_port }}
      AddressFamily inet
      Protocol 2

      PermitRootLogin no
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      KbdInteractiveAuthentication no
      UsePAM yes
      PubkeyAuthentication yes
      PermitEmptyPasswords no

      AllowUsers {{ deploy_user }}
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2

      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding no
      PermitUserEnvironment no
      PrintMotd no
    validate: /usr/sbin/sshd -t -f %s

- name: Validate full sshd config (drop-in + base)
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Disable ssh.socket if present (force classic listening on our port)
  ansible.builtin.systemd:
    name: ssh.socket
    enabled: false
    state: stopped
  failed_when: false

- name: Restart sshd to apply new config
  ansible.builtin.service:
    name: ssh
    state: restarted
    enabled: true

# === Smoke test : on prouve que deploy@ssh_port marche AVANT de continuer ===

- name: Wait until new SSH port is listening (from local)
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ssh_port }}"
    state: started
    timeout: 30
  delegate_to: localhost
  become: false

- name: Smoke-test deploy@{{ ssh_port }} from local
  ansible.builtin.command: >-
    ssh -p {{ ssh_port }}
        -o StrictHostKeyChecking=accept-new
        -o BatchMode=yes
        -o ConnectTimeout=10
        -o UserKnownHostsFile=/dev/null
        -o LogLevel=ERROR
        {% if ansible_ssh_private_key_file is defined %}-i {{ ansible_ssh_private_key_file }}{% endif %}
        {{ deploy_user }}@{{ ansible_host }}
        true
  delegate_to: localhost
  become: false
  changed_when: false
  register: deploy_smoke
  failed_when: deploy_smoke.rc != 0

# === Bascule de la connexion pour la suite du play ===

- name: Switch Ansible connection to {{ deploy_user }}@{{ ssh_port }}
  ansible.builtin.set_fact:
    ansible_user: "{{ deploy_user }}"
    ansible_port: "{{ ssh_port }}"
    ansible_become: true

- name: Reset SSH control socket so the new connection takes effect
  ansible.builtin.meta: reset_connection

- name: Verify new connection works (deploy@{{ ssh_port }})
  ansible.builtin.ping:
