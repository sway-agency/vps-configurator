---
# Installe Go {{ go_version }} (system-wide), zsh + oh-my-zsh + NVM (par user),
# et écrit un .zshrc avec le theme robbyrussell pour root ET deploy.
#
# Téléchargements via HTTPS (go.dev + raw.githubusercontent.com) — passent à
# travers le firewall (egress 443 ouvert).

- name: Set list of users to provision (root + deploy)
  ansible.builtin.set_fact:
    shell_users:
      - { name: root, home: /root }
      - { name: "{{ deploy_user }}", home: "/home/{{ deploy_user }}" }

- name: Default go_version si non défini dans group_vars
  ansible.builtin.set_fact:
    go_version: "{{ go_version | default('1.26.0') }}"

# === Pré-requis apt ===

- name: Install zsh, git, curl, ca-certificates, acl
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - curl
      - ca-certificates
      - acl   # nécessaire pour become_user root→deploy (gestion des perms tmpfile)
    state: present
    update_cache: true
    cache_valid_time: 3600

# === Go (system-wide dans /usr/local/go) ===

- name: Detect Go arch (amd64 / arm64)
  ansible.builtin.set_fact:
    go_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_installed
  changed_when: false
  failed_when: false

- name: Install / upgrade Go {{ go_version }}
  when: ('go' + go_version + ' ') not in (go_installed.stdout | default(''))
  block:
    - name: Download Go {{ go_version }} tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
        dest: "/tmp/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
        mode: "0644"

    - name: Remove previous Go install
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    - name: Extract Go to /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
        dest: /usr/local
        remote_src: true

    - name: Clean up Go tarball
      ansible.builtin.file:
        path: "/tmp/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
        state: absent

# === oh-my-zsh + NVM par user ===

- name: Install oh-my-zsh per user (idempotent — skip si déjà présent)
  ansible.builtin.shell: |
    set -euo pipefail
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
  args:
    creates: "{{ item.home }}/.oh-my-zsh"
    executable: /bin/bash
  environment:
    HOME: "{{ item.home }}"
  become_user: "{{ item.name }}"
  loop: "{{ shell_users }}"
  loop_control:
    label: "{{ item.name }}"

# PROFILE=/dev/null empêche le script NVM de modifier les .zshrc/.bashrc :
# on gère le sourcing nous-mêmes dans le template ci-dessous.
- name: Install NVM per user (idempotent)
  ansible.builtin.shell: |
    set -euo pipefail
    PROFILE=/dev/null bash -c "$(curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh)"
  args:
    creates: "{{ item.home }}/.nvm/nvm.sh"
    executable: /bin/bash
  environment:
    HOME: "{{ item.home }}"
  become_user: "{{ item.name }}"
  loop: "{{ shell_users }}"
  loop_control:
    label: "{{ item.name }}"

# === Theme custom "girly" ===
# Format : user@host ~/dir git:branch ✓/✗ ❤
- name: Ensure custom theme directory exists per user
  ansible.builtin.file:
    path: "{{ item.home }}/.oh-my-zsh/custom/themes"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0755"
  loop: "{{ shell_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy girly.zsh-theme per user
  ansible.builtin.copy:
    dest: "{{ item.home }}/.oh-my-zsh/custom/themes/girly.zsh-theme"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
    content: |
      # girly.zsh-theme — managed by Ansible (vps-configurator)
      # Format : [yy:mm:dd hh:mm:ss] user@host ~/dir git:branch ✓/✗ ❤
      # Toutes les couleurs sont bold (ou white) → contraste max sur fond noir.
      # Pas de bleu non-bold (illisible sur black), pas de gris/dim.

      local _time="%{$fg_bold[yellow]%}[%{$fg_bold[white]%}%D{{ '{' }}%y:%m:%d %H:%M:%S}%{$fg_bold[yellow]%}]%{$reset_color%}"
      local _user="%{$fg_bold[magenta]%}%n%{$reset_color%}"
      local _at="%{$fg_bold[green]%}@%{$reset_color%}"
      local _host="%{$fg_bold[cyan]%}%m%{$reset_color%}"
      local _pwd="%{$fg_bold[yellow]%}%~%{$reset_color%}"
      local _heart="%{$fg_bold[red]%}❤%{$reset_color%}"

      PROMPT="${_time} ${_user}${_at}${_host} ${_pwd}\$(git_prompt_info) ${_heart} "

      ZSH_THEME_GIT_PROMPT_PREFIX=" %{$fg_bold[green]%}git:%{$fg_bold[magenta]%}"
      ZSH_THEME_GIT_PROMPT_SUFFIX="%{$reset_color%}"
      ZSH_THEME_GIT_PROMPT_DIRTY=" %{$fg_bold[red]%}✗%{$reset_color%}"
      ZSH_THEME_GIT_PROMPT_CLEAN=" %{$fg_bold[green]%}✓%{$reset_color%}"
  loop: "{{ shell_users }}"
  loop_control:
    label: "{{ item.name }}"

# === .zshrc + shell par user ===

- name: Deploy .zshrc per user
  ansible.builtin.copy:
    dest: "{{ item.home }}/.zshrc"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
    content: |
      # Managed by Ansible — vps-configurator (do not edit by hand)

      # === oh-my-zsh ===
      export ZSH="$HOME/.oh-my-zsh"
      ZSH_THEME="girly"
      plugins=(git)
      source "$ZSH/oh-my-zsh.sh"

      # === NVM ===
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

      # === Go ===
      export PATH="$PATH:/usr/local/go/bin"
  loop: "{{ shell_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set default shell to zsh per user
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /usr/bin/zsh
  loop: "{{ shell_users }}"
  loop_control:
    label: "{{ item.name }}"
