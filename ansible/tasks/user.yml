---
- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    state: present

- name: Set sudo NOPASSWD for deploy user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# Anti-lockout : on récupère les clés autorisées de root et on les copie
# vers le deploy user, pour qu'une connexion root@22 actuelle ne soit pas
# perdue après bascule sur deploy@ssh_port.
- name: Slurp root authorized_keys (fallback access)
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: root_authorized_keys
  failed_when: false

- name: Install root authorized_keys into deploy user (anti-lockout)
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ root_authorized_keys.content | b64decode }}"
    state: present
  when:
    - root_authorized_keys.content is defined
    - (root_authorized_keys.content | b64decode | trim) | length > 0

- name: Install authorized SSH key for deploy user
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ ssh_public_key }}"
    state: present

- name: Lock password for deploy user (key-only)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    password_lock: true
