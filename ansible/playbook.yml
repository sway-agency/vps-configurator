---
- name: Harden VPS for Docker workloads
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert OS is supported
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "Only Debian/Ubuntu are supported."

    # Validation stricte de la clé SSH AVANT de toucher à quoi que ce soit.
    # Une clé invalide = lockout garanti après hardening.
    - name: Assert ssh_public_key is well-formed
      ansible.builtin.assert:
        that:
          - ssh_public_key is defined
          - ssh_public_key | length > 80
          - ssh_public_key is match('^(ssh-(rsa|ed25519|ecdsa)|ecdsa-sha2-)\\s+[A-Za-z0-9+/=]+(\\s+\\S+)?$')
        fail_msg: >-
          ssh_public_key absente ou malformée. Doit commencer par
          'ssh-ed25519', 'ssh-rsa', 'ssh-ecdsa' ou 'ecdsa-sha2-...'.
          Édite group_vars/all.yml.

    - name: Assert deploy_user looks sane
      ansible.builtin.assert:
        that:
          - deploy_user is defined
          - deploy_user is match('^[a-z_][a-z0-9_-]{0,30}$')
        fail_msg: "deploy_user invalide. Doit matcher [a-z_][a-z0-9_-]{0,30}."

  tasks:
    - name: Apply base
      ansible.builtin.import_tasks: tasks/base.yml
      tags: [base]

    - name: Apply user
      ansible.builtin.import_tasks: tasks/user.yml
      tags: [user]

    - name: Apply ssh
      ansible.builtin.import_tasks: tasks/ssh.yml
      tags: [ssh]

    - name: Apply honeypot
      ansible.builtin.import_tasks: tasks/honeypot.yml
      tags: [honeypot]
      when: honeypot_enabled | bool

    - name: Apply docker
      ansible.builtin.import_tasks: tasks/docker.yml
      tags: [docker]

    - name: Apply www
      ansible.builtin.import_tasks: tasks/www.yml
      tags: [www]

    - name: Apply app_env
      ansible.builtin.import_tasks: tasks/app_env.yml
      tags: [app_env]

    - name: Apply auto_updates
      ansible.builtin.import_tasks: tasks/auto_updates.yml
      tags: [updates]

    - name: Apply security_scans
      ansible.builtin.import_tasks: tasks/security_scans.yml
      tags: [security_scans]
      when: security_scans_enabled | bool

    - name: Apply zsh
      ansible.builtin.import_tasks: tasks/zsh.yml
      tags: [zsh]
      when: install_zsh | default(true) | bool

    # Firewall en dernier : on ouvre tout ce qu'il faut avant de claquer la porte.
    - name: Apply firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
      tags: [firewall]

  handlers:
    - name: Import handlers
      ansible.builtin.import_tasks: handlers/main.yml
